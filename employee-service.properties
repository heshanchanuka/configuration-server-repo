eureka.instance.client.serverUrl.defaultZone=http://Localhost:8761/eureka

server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/employee_db_1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA Vendor Adapter Configuration
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Circuit Breaker health metrics enable kirima
management.health.circuitbreakers.enabled=true

# Actuator eke full details balanna (Meka oya kalinma dala athi)
management.endpoint.health.show-details=always

spring.boot.message=mama employee asdcfd
